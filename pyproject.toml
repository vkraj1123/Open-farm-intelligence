[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-farm-intelligence"
version = "0.1.0"
description = "An open-source farm intelligence and orchestration layer for Indian agriculture."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.scripts]
ofi-recovery = "ofi.services.recovery_runner:main"
ofi-schema = "ofi.twin.migrate:main"
ofi-recovery-check = "ofi.twin.recovery_check:main"
ofi-recovery-drill = "ofi.twin.recovery_drill:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
auth = ["PyJWT[crypto]>=2.10,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "PyJWT[crypto]>=2.10,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ofi = ["twin/schema.sql", "twin/migrations/*.sql"]
